name: Deploy Dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: railway-development
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      # Stamp → railway up → poll /api/health until it reports this exact sha.
      # Shared with promote.yml so every environment proves "deployed" the same way.
      - uses: ./.github/actions/railway-deploy
        with:
          commit_sha: ${{ github.event.workflow_run.head_sha }}
          environment_label: Dev
          app_url: ${{ vars.APP_URL }}
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          railway_project_id: ${{ vars.RAILWAY_PROJECT_ID }}
          railway_service_id: ${{ vars.RAILWAY_SERVICE_ID }}
          railway_environment_id: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
