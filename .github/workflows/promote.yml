name: Promote UAT and Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA already verified in Dev
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: railway-promotion
  cancel-in-progress: false

jobs:
  deploy-uat:
    runs-on: ubuntu-latest
    environment:
      name: uat
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --global @railway/cli
      # Same stamp → deploy → sha-verified health gate as Deploy Dev (F32): a
      # promotion only passes when UAT is serving exactly the requested commit.
      - uses: ./.github/actions/railway-deploy
        with:
          commit_sha: ${{ inputs.commit_sha }}
          environment_label: UAT
          app_url: ${{ vars.APP_URL }}
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          railway_project_id: ${{ vars.RAILWAY_PROJECT_ID }}
          railway_service_id: ${{ vars.RAILWAY_SERVICE_ID }}
          railway_environment_id: ${{ vars.RAILWAY_ENVIRONMENT_ID }}

  deploy-production:
    needs: deploy-uat
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --global @railway/cli
      - uses: ./.github/actions/railway-deploy
        with:
          commit_sha: ${{ inputs.commit_sha }}
          environment_label: Production
          app_url: ${{ vars.APP_URL }}
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          railway_project_id: ${{ vars.RAILWAY_PROJECT_ID }}
          railway_service_id: ${{ vars.RAILWAY_SERVICE_ID }}
          railway_environment_id: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
