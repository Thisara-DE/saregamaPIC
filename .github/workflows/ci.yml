name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - name: Audit Python dependencies
        run: uv run --with pip-audit==2.10.0 pip-audit
      - name: Static security analysis
        run: uv run --with bandit==1.9.4 bandit -r app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.8.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Audit npm dependencies
        # npm audit has no per-advisory ignore, so we filter its JSON output.
        # GHSA-qwww-vcr4-c8h2 (react-router RSC-mode CSRF) is allowlisted: it only
        # affects the unstable RSC APIs, which this Vite SPA (createBrowserRouter)
        # does not use, and there is no fix on the react-router v7 line — v8 removes
        # react-router-dom and requires Node 22 / React 19.2, which this project is
        # not on. Every OTHER high/critical advisory still fails the build.
        run: |
          allow="https://github.com/advisories/GHSA-qwww-vcr4-c8h2"
          npm audit --json > npm-audit.json || true
          npm audit || true
          count=$(jq --arg allow "$allow" '[.vulnerabilities[]?.via[]? | select(type=="object") | select(.severity=="high" or .severity=="critical") | select(.url != $allow)] | length' npm-audit.json)
          if [ "$count" -gt 0 ]; then
            echo "::error::$count high/critical npm advisory(ies) outside the allowlist"
            jq --arg allow "$allow" '[.vulnerabilities[]?.via[]? | select(type=="object") | select(.severity=="high" or .severity=="critical") | select(.url != $allow)]' npm-audit.json
            exit 1
          fi
          echo "No high/critical advisories outside the allowlist."

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend, secrets]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag saregamapic:${{ github.sha }} .
      - name: Scan container for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: saregamapic:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
