name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - name: Audit Python dependencies
        run: uv run --with pip-audit==2.10.0 pip-audit
      - name: Static security analysis
        run: uv run --with bandit==1.9.4 bandit -r app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.8.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Audit npm dependencies
        # npm audit has no per-advisory ignore, so we filter its JSON output.
        # `allow` is a newline-separated list of advisory URLs; a `via.url` is
        # allowlisted when it appears as a substring of that blob (jq contains).
        # Every OTHER high/critical advisory still fails the build.
        #
        # Allowlisted (dev/build-only, transitive, not in the deployed artifact):
        #   GHSA-qwww-vcr4-c8h2 — react-router RSC-mode CSRF. Only the unstable RSC
        #     APIs are affected; this Vite SPA (createBrowserRouter) doesn't use them,
        #     and there's no fix on the react-router v7 line (v8 needs Node 22 / React
        #     19.2, blocked by the Node 20.8 pin).
        #   GHSA-mh99-v99m-4gvg — brace-expansion DoS. The genuinely vulnerable v5
        #     instances are bumped to the patched 5.0.8 in package-lock.json. The two
        #     that still trip audit (1.1.16, 2.1.2) are the maintainer's *patched*
        #     maintenance releases; npm audit collapses this multi-major advisory into
        #     a single "<=5.0.7" range and false-positives them. Its only offered fix
        #     is eslint v10 (major), blocked by the same Node 20.8 pin.
        #   GHSA-rgw5-rvv9-x895 — brace-expansion DoS, follow-up to the above that
        #     bypasses the CVE-2026-14257 mitigation. Unlike GHSA-mh99, the locked
        #     1.1.16 / 2.1.2 ARE affected (fixes are 1.1.18 / 2.1.4 / 5.0.9). Accepted,
        #     not patched: brace-expansion is build/lint tooling only (eslint, glob,
        #     minimatch) and is never bundled into the deployed SPA, so this DoS is
        #     unreachable in production; forcing the patched versions across the 1/2/5
        #     majors in the tree via an override risks breaking minimatch. Revisit at
        #     the next Node-unpin / eslint-major bump.
        #   GHSA-7p8r-x3mc-p8w7 — fast-uri host confusion. Build-time only:
        #     vite-plugin-pwa -> workbox-build -> ajv -> fast-uri, used to generate
        #     the service worker at build. Not bundled into the deployed artifact and
        #     never parses attacker-controlled URIs at app runtime, so it is
        #     unreachable in production. Fold the patched fast-uri into the lockfile
        #     at the next dependency bump (a fix exists) and drop this line then.
        run: |
          allow="https://github.com/advisories/GHSA-qwww-vcr4-c8h2
          https://github.com/advisories/GHSA-mh99-v99m-4gvg
          https://github.com/advisories/GHSA-rgw5-rvv9-x895
          https://github.com/advisories/GHSA-7p8r-x3mc-p8w7"
          npm audit --json > npm-audit.json || true
          npm audit || true
          filter='[.vulnerabilities[]?.via[]? | select(type=="object") | select(.severity=="high" or .severity=="critical") | select(.url as $u | ($allow | contains($u)) | not)]'
          count=$(jq --arg allow "$allow" "$filter | length" npm-audit.json)
          if [ "$count" -gt 0 ]; then
            echo "::error::$count high/critical npm advisory(ies) outside the allowlist"
            jq --arg allow "$allow" "$filter" npm-audit.json
            exit 1
          fi
          echo "No high/critical advisories outside the allowlist."

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend, secrets]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag saregamapic:${{ github.sha }} .
      - name: Scan container for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: saregamapic:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
