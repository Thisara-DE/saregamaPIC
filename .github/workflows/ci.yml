name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - name: Audit Python dependencies
        run: uv run --with pip-audit==2.10.0 pip-audit
      - name: Static security analysis
        run: uv run --with bandit==1.9.4 bandit -r app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Audit npm dependencies
        # npm audit has no per-advisory ignore, so we filter its JSON output.
        # `allow` is a newline-separated list of advisory URLs; a `via.url` is
        # allowlisted when it appears as a substring of that blob (jq contains).
        # Every OTHER high/critical advisory still fails the build.
        #
        # The allowlist is deliberately EMPTY right now: an empty blob allowlists
        # nothing, so every high/critical advisory fails. The mechanism stays
        # because fresh upstream CVEs land on this gate regularly, and an
        # exception is then a one-line change.
        #
        # Standing rule: bump beats allowlist whenever a fixed release exists.
        # Entries retired once their fix shipped:
        #   (2026-09-04) brace-expansion GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895
        #     and fast-uri GHSA-7p8r-x3mc-p8w7 — `npm audit fix` landed the
        #     maintainers' in-range patched releases with no override.
        #   (2026-09-08) react-router GHSA-qwww-vcr4-c8h2 (RSC-mode CSRF) — the old
        #     entry claimed no fix existed on the v7 line and blamed the Node 20.8
        #     pin for blocking v8. Both claims were wrong: react-router-dom 7.18.3
        #     fixes the advisory, there is no v8 release at all (latest is 7.18.3),
        #     and 7.18.3 still declares node >=20. Bumping the exact pin
        #     7.18.1 -> 7.18.3 clears it outright, so nothing is allowlisted.
        run: |
          allow=""
          npm audit --json > npm-audit.json || true
          npm audit || true
          filter='[.vulnerabilities[]?.via[]? | select(type=="object") | select(.severity=="high" or .severity=="critical") | select(.url as $u | ($allow | contains($u)) | not)]'
          count=$(jq --arg allow "$allow" "$filter | length" npm-audit.json)
          if [ "$count" -gt 0 ]; then
            echo "::error::$count high/critical npm advisory(ies) outside the allowlist"
            jq --arg allow "$allow" "$filter" npm-audit.json
            exit 1
          fi
          echo "No high/critical advisories outside the allowlist."

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend, secrets]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag saregamapic:${{ github.sha }} .
      - name: Scan container for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: saregamapic:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Accepted-risk allowlist for base-image packaging-tool CVEs that are
          # unreachable at runtime; each entry is justified in .trivyignore. Set
          # explicitly rather than relying on the default working-dir lookup.
          trivyignores: .trivyignore
          exit-code: "1"
